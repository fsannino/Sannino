name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancela runs redundantes: se um novo push chega no mesmo PR, mata o anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (next lint)
        run: npm run lint

      - name: Build (next build)
        run: npm run build
        env:
          # Evita telemetria opcional em CI
          NEXT_TELEMETRY_DISABLED: 1
